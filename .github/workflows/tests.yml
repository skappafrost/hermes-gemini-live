name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest on ${{ matrix.os }} (python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The plugin declares no dependencies on purpose (see README). These are the packages the
      # runtime already carries, plus what the test doubles need.
      - name: install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest pytest-asyncio httpx starlette websockets
      - name: unit tests
        run: python -m pytest -q

  desktop-surface:
    name: desktop plugin parses and stays on the SDK surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: syntax check
        run: node --check desktop/plugin.js
      - name: only the allowed specifiers may be imported
        run: |
          set -e
          bad=$(grep -Eo "^import .* from '[^']+'" desktop/plugin.js \
                | grep -v "'@hermes/plugin-sdk'" | grep -v "'react'" | grep -v "'react/jsx-runtime'" || true)
          if [ -n "$bad" ]; then
            echo "imports outside the plugin SDK surface:"; echo "$bad"; exit 1
          fi
